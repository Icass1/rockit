name: Build Android preview APK

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-preview-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build and publish preview APK
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.0.8

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Install dependencies
              run: pnpm --dir frontend install --frozen-lockfile

            - name: Ensure Hermes compiler is executable
              working-directory: frontend/apps/mobile
              env:
                  EAS_BUILD_PLATFORM: android
              run: node scripts/check-hermes.cjs

            - name: Build preview APK locally
              working-directory: frontend/apps/mobile/android
              env:
                  EXPO_PUBLIC_BACKEND_URL: https://api-rockit.rockhosting.org
                  EXPO_PUBLIC_PLATFORM: android
              run: ./gradlew :app:assembleRelease -Prockit.preview=true --no-daemon

            - name: Verify preview APK
              working-directory: frontend/apps/mobile/android
              run: |
                  "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
                  "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/aapt" dump badging app/build/outputs/apk/release/app-release.apk | tee app/build/outputs/apk/release/app-release.badging.txt
                  grep -q "package: name='com.rockit.mobile.preview'" app/build/outputs/apk/release/app-release.badging.txt

            - name: Upload preview APK
              uses: actions/upload-artifact@v4
              with:
                  name: RockIt-Android-preview-${{ github.run_number }}
                  path: |
                      frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
                      frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.badging.txt
                  if-no-files-found: error
                  retention-days: 14
