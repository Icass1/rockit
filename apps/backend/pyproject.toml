[project]
name = "rockit-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.22,<1",
  "aiofiles==25.1.0",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "bcrypt==4.0.1",
  "bgutil-ytdlp-pot-provider==2.0.2",
  "beautifulsoup4==4.12.3",
  "cachetools==5.5.0",
  "colorama==0.4.6",
  "dacite==1.9.2",
  "ffmpeg-python==0.2.0",
  "google-api-core==2.23.0",
  "google-auth==2.36.0",
  "google-auth-httplib2==0.2.0",
  "httplib2==0.22.0",
  "httpx==0.28.1",
  "jaconv==0.4.0",
  "mutagen==1.47.0",
  "numpy==2.1.3",
  "opencv-python-headless==4.13.0.92",
  "openpyxl==3.1.5",
  "passlib==1.7.4",
  "pillow==11.0.0",
  "psycopg2-binary==2.9.10",
  "pykakasi==2.3.0",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.0.1",
  "python-jose==3.5.0",
  "python-slugify==8.0.4",
  "python-telegram-bot==22.5",
  "pytube==15.0.0",
  "PyYAML==6.0.2",
  "redis==6.0.0",
  "requests==2.32.3",
  "soundcloud-v2==1.6.0",
  "spotifyscraper==3.7.0",
  "SQLAlchemy==2.0.42",
  "syncedlyrics==1.0.1",
  "tqdm==4.67.1",
  "Unidecode==1.4.0",
  "uvicorn==0.23.2",
  "websockets==14.2",
  "yt-dlp==2026.8.19",
  "yt-dlp-ejs==0.8.0",
  "ytmusicapi==1.11.1",
  "fastapi>=0.115,<0.116",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.32",
  "boto3>=1.35,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pyright>=1.1.408", "ruff>=0.8", "boto3-stubs[s3]>=1.35,<2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["system_tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"
markers = ["unit: Isolated business logic and validation tests.", "integration: Direct controller and access integration tests."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
