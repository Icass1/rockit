name: Publish Docker images

on:
    push:
        branches: [main]

permissions:
    contents: write
    packages: write
    pull-requests: read

concurrency:
    group: publish-stable-images
    cancel-in-progress: false

jobs:
    prepare:
        name: Prepare Docker image version
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.value }}
            image: ${{ steps.version.outputs.image }}
            repository: ${{ steps.image.outputs.repository }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Detect a develop promotion
              id: promotion
              uses: actions/github-script@v7
              with:
                  script: |
                      const stable = context.ref === "refs/heads/main";
                      const pulls = stable ? await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                          ...context.repo, commit_sha: context.sha,
                      }) : [];
                      const promoted = pulls.some(pr => pr.merged_at && pr.head.ref === "develop" &&
                          pr.base.ref === "main" && pr.merge_commit_sha === context.sha);
                      core.setOutput("release", String(promoted));

            - name: Calculate version and tag stable promotions
              id: version
              env:
                  PROMOTION: ${{ steps.promotion.outputs.release }}
              shell: bash
              run: |
                  if [ "$PROMOTION" = "true" ]; then
                      version=$(node scripts/version.cjs --release)
                      tag="v$version"
                      if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
                          git tag "$tag" "$GITHUB_SHA"
                          git push origin "$tag"
                      fi
                  else
                      version=$(node scripts/version.cjs)
                  fi
                  echo "value=$version" >> "$GITHUB_OUTPUT"
                  echo "image=$version-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
                  echo "### RockIt $version" >> "$GITHUB_STEP_SUMMARY"

            - name: Prepare image names
              id: image
              shell: bash
              run: |
                  echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    publish:
        name: Build and publish ${{ matrix.image }} image
        needs: prepare
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: backend
                      dockerfile: ./apps/backend/Dockerfile
                      target: ""
                      build-args: |
                          ROCKIT_BUILD_REVISION=${{ github.sha }}
                          ROCKIT_VERSION=${{ needs.prepare.outputs.version }}
                    - image: frontend
                      dockerfile: ./apps/web/Dockerfile
                      target: runner
                      build-args: |
                          NEXT_PUBLIC_BACKEND_URL=https://api-rockit.rockhosting.org
                          ROCKIT_VERSION=${{ needs.prepare.outputs.version }}
                    - image: mobile-pwa
                      dockerfile: ./apps/mobile/Dockerfile.pwa
                      target: runtime
                      build-args: |
                          EXPO_PUBLIC_BACKEND_URL=https://api-rockit.rockhosting.org

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  target: ${{ matrix.target }}
                  push: true
                  tags: |
                      ghcr.io/${{ needs.prepare.outputs.repository }}/${{ matrix.image }}:latest-stable
                      ghcr.io/${{ needs.prepare.outputs.repository }}/${{ matrix.image }}:${{ needs.prepare.outputs.image }}
                  build-args: ${{ matrix.build-args }}
