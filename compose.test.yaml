services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rockit-test
      POSTGRES_DB: rockit-test
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  storage:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rockit-test
      MINIO_ROOT_PASSWORD: rockit-test-secret
    ports: ["127.0.0.1:19000:9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
