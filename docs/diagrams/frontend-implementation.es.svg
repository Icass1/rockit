<title id="title">RockIt! — Arquitectura frontend implementada</title>
<desc id="desc">Escritorio Next y una interfaz móvil Expo para PWA iOS y APK Android comparten lógica, componentes UI y tokens. Los adaptadores web y nativos conservan sus APIs propias y usan el mismo backend.</desc>
