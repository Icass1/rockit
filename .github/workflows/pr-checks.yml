name: PR checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project apps/backend --locked
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: docker compose -f compose.test.yaml up -d --wait
      - name: Unit and PostgreSQL/Silo integration tests
        env:
          ROCKIT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:rockit-test@127.0.0.1:15432/postgres
          ROCKIT_TEST_S3_ENDPOINT: http://127.0.0.1:19000
        run: uv run --project apps/backend pytest -q
      - run: uv run --project apps/backend pyright
      - run: uv run --project apps/backend black --check apps/backend conftest.py
      - run: uv run --project apps/backend ruff check apps/backend --select F821,F811
      - if: always()
        run: docker compose -f compose.test.yaml down -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/backend --locked
      - name: Generated contract drift
        run: |
          uv run --project apps/backend python -c 'import conftest,runpy,sys; sys.argv=["backend","models"]; runpy.run_module("backend",run_name="__main__")'
          pnpm exec prettier --write packages/shared/src/dto packages/shared/src/http/baseHttp.ts packages/shared/src/models/types/vocabulary.ts
          git diff --exit-code -- packages/shared
      - run: pnpm check:frontend
      - run: pnpm --dir apps/mobile exec tsc --noEmit
      - run: pnpm --dir apps/web build
