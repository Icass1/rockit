<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" role="img" aria-labelledby="title desc">
<title id="title">RockIt! — Implemented frontend architecture</title>
<desc id="desc">Next desktop and one Expo mobile UI for iOS PWA and Android APK share logic, UI components and design tokens. Browser and native adapters keep platform APIs separate and use the same backend.</desc>
<rect width="1440" height="1220" fill="#f6f7fa"/>
