name: PR checks

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read

concurrency:
    group: pr-checks-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    checks:
        name: PR quality checks
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.0.8

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.14.0"
                  cache: pnpm
                  cache-dependency-path: |
                      pnpm-lock.yaml
                      frontend/pnpm-lock.yaml

            - name: Install Python dependencies
              run: |
                  python -m venv venv
                  venv/bin/python -m pip install -r backend/requirements.txt
                  echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"

            - name: Install JavaScript dependencies
              run: |
                  pnpm install --frozen-lockfile
                  pnpm --dir frontend install --frozen-lockfile

            - name: Run formatting, lint, and type checks
              shell: bash
              run: |
                  failed=0

                  black . || failed=1
                  pnpm exec prettier -w "**/*.{ts,tsx}" || failed=1

                  (cd frontend && pnpm lint) > lint.txt 2>&1 || failed=1
                  cat lint.txt

                  pyright > pyright.txt 2>&1 || failed=1
                  cat pyright.txt

                  # Formatting tools can succeed while rewriting tracked files.
                  git diff --exit-code HEAD || failed=1

                  # Ignore generated artifacts covered by .gitignore, including logs.
                  untracked="$(git ls-files --others --exclude-standard)"
                  if [[ -n "$untracked" ]]; then
                      echo "::error::Checks created unexpected untracked files:"
                      printf '%s\n' "$untracked"
                      failed=1
                  fi

                  exit "$failed"

            - name: Upload check logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pr-check-logs
                  path: |
                      lint.txt
                      pyright.txt
                  if-no-files-found: ignore
                  retention-days: 14
