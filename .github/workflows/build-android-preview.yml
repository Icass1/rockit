name: Build Android preview APK

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-preview-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build and publish preview APK
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.0.8

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.14.0
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Install dependencies
              run: pnpm --dir frontend install --frozen-lockfile

            - name: Ensure Hermes compiler is executable
              working-directory: frontend/apps/mobile
              env:
                  EAS_BUILD_PLATFORM: android
              run: node scripts/check-hermes.cjs

            - name: Build preview APK locally
              working-directory: frontend/apps/mobile/android
              env:
                  NODE_ENV: production
                  EXPO_PUBLIC_BACKEND_URL: https://api-rockit.rockhosting.org
                  EXPO_PUBLIC_PLATFORM: android
              run: ./gradlew :app:assembleRelease -Prockit.preview=true --no-daemon

            - name: Verify preview APK
              working-directory: frontend/apps/mobile/android
              run: |
                  APK_PATH=app/build/outputs/apk/release/app-release.apk
                  OUTPUT_DIR=app/build/outputs/apk/release
                  BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"

                  "${BUILD_TOOLS}/apksigner" verify --verbose "${APK_PATH}"
                  "${BUILD_TOOLS}/zipalign" -c -P 16 4 "${APK_PATH}"
                  "${BUILD_TOOLS}/aapt" dump badging "${APK_PATH}" | tee "${OUTPUT_DIR}/app-release.badging.txt"
                  grep -q "package: name='com.rockit.mobile.preview'" "${OUTPUT_DIR}/app-release.badging.txt"

                  # Android packages AndroidManifest.xml as binary AXML by design.
                  # Export a human-readable copy so downloaded build artifacts can
                  # be inspected without mistaking the packaged manifest for damage.
                  "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest print "${APK_PATH}" > "${OUTPUT_DIR}/AndroidManifest.xml"
                  grep -q 'package="com.rockit.mobile.preview"' "${OUTPUT_DIR}/AndroidManifest.xml"

            - name: Enable Android emulator acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - name: Install and launch preview on Android 13
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 33
                  arch: x86_64
                  target: default
                  disable-animations: true
                  script: python3 frontend/apps/mobile/scripts/smoke-test-android.py frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.apk --serial emulator-5554 --output android-smoke-test

            - name: Upload installation and startup diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: RockIt-Android-preview-diagnostics-${{ github.run_number }}
                  path: android-smoke-test/
                  if-no-files-found: ignore
                  retention-days: 14

            - name: Upload preview APK
              uses: actions/upload-artifact@v4
              with:
                  name: RockIt-Android-preview-${{ github.run_number }}
                  path: |
                      frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
                      frontend/apps/mobile/android/app/build/outputs/apk/release/app-release.badging.txt
                      frontend/apps/mobile/android/app/build/outputs/apk/release/AndroidManifest.xml
                  if-no-files-found: error
                  retention-days: 14
