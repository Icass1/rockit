name: Publish stable Docker images

on:
    push:
        branches: [develop, main]

permissions:
    contents: read
    packages: write

concurrency:
    group: publish-stable-images-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Build and publish Docker images
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare image names
              id: image
              shell: bash
              run: |
                  echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
                  if [ "${{ github.ref_name }}" = "develop" ]; then
                      echo "tag=latest-develop" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and publish backend image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.backend
                  push: true
                  tags: ghcr.io/${{ steps.image.outputs.repository }}/backend:${{ steps.image.outputs.tag }}
                  build-args: |
                      ROCKIT_BUILD_REVISION=${{ github.sha }}

            - name: Build and publish Next.js image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.frontend
                  push: true
                  tags: ghcr.io/${{ steps.image.outputs.repository }}/frontend:${{ steps.image.outputs.tag }}
                  build-args: |
                      NEXT_PUBLIC_BACKEND_URL=https://api-rockit.rockhosting.org
