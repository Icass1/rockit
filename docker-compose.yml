services:
    backend:
        container_name: rockit-beta-backend
        env_file:
            - .env.production

        build:
            context: .
            dockerfile: Dockerfile.backend
        restart: unless-stopped
        volumes:
            - ./media:/app/media
            - ./images:/app/images
            - ./temp:/app/temp
            - ./logs:/app/logs
            - ./builds:/app/builds
            - /mnt/music:/mnt/music
        networks:
            - rockit-beta
            - postgres_postgres-network
        ports:
            - "9101:8000"
        depends_on:
            - pot-provider

    # Mints YouTube proof-of-origin tokens for yt-dlp. Without it the backend
    # falls back to the PO-token-free clients, which work but cover fewer
    # videos. Not exposed outside the compose network.
    pot-provider:
        container_name: rockit-beta-pot-provider
        # Pinned to the same version as the bgutil-ytdlp-pot-provider plugin in
        # backend/requirements.txt. The plugin refuses to run against a server
        # on a different major version, so :latest would silently disable PO
        # tokens the next time upstream bumps it. Bump both together.
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
        init: true
        restart: unless-stopped
        networks:
            - rockit-beta

    frontend:
        container_name: rockit-beta-frontend
        env_file:
            - .env.production
        build:
            context: .
            dockerfile: Dockerfile.frontend
            args:
                NEXT_PUBLIC_BACKEND_URL: https://api-rockit.rockhosting.org
        restart: unless-stopped
        ports:
            - "9100:3000"
        networks:
            - rockit-beta

networks:
    rockit-beta:
        driver: bridge
        ipam:
            config:
                - subnet: 172.21.0.0/16
                  gateway: 172.21.0.1
    postgres_postgres-network:
        external: true
