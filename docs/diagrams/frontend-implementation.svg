<text x="56" y="105" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17202f" text-anchor="start">Implemented frontend architecture</text>
<text x="1384" y="67" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#aa1c75" text-anchor="end">PR #189</text>
<text x="1384" y="105" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#516077" text-anchor="end">Shared source · independent deployments</text>
