name: Android release build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Android release build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_ENV: production
      EXPO_PUBLIC_BACKEND_URL: https://api-rockit.rockhosting.org
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check Hermes compiler
        run: node scripts/check-hermes.cjs
        working-directory: frontend/apps/mobile
        env:
          EAS_BUILD_PLATFORM: android

      - name: Compile and package release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        working-directory: frontend/apps/mobile/android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rockit-android-release
          path: frontend/apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
